name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    uses: LegionForge/dev-rig/.github/workflows/rust-lint.yml@ddbe4eaed79711eab4ad741403c0a550232fd0fe

  test:
    uses: LegionForge/dev-rig/.github/workflows/rust-test.yml@ddbe4eaed79711eab4ad741403c0a550232fd0fe

  sast:
    uses: LegionForge/dev-rig/.github/workflows/rust-sast.yml@ddbe4eaed79711eab4ad741403c0a550232fd0fe
    with:
      source-dirs: "src"
    permissions:
      contents: read
      security-events: write
      actions: read       # required by the nested codeql job

  audit:
    uses: LegionForge/dev-rig/.github/workflows/rust-audit.yml@ddbe4eaed79711eab4ad741403c0a550232fd0fe

  secrets:
    uses: LegionForge/dev-rig/.github/workflows/secrets.yml@ddbe4eaed79711eab4ad741403c0a550232fd0fe
    permissions:
      contents: read

  sbom:
    uses: LegionForge/dev-rig/.github/workflows/rust-sbom.yml@ddbe4eaed79711eab4ad741403c0a550232fd0fe

  trivy:
    uses: LegionForge/dev-rig/.github/workflows/trivy.yml@ddbe4eaed79711eab4ad741403c0a550232fd0fe
    permissions:
      security-events: write
      contents: read
